        rem @set VCINSTALLDIR=C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\
        rem @set VS100COMNTOOLS=C:\Program Files (x86)\Microsoft Visual Studio 10.0\Common7\Tools\
