    - name: Add Visual Studio path to registry
      run: reg import 'VS2010_min.reg'

    - name: Install Windows SDK 7.1 (modified)
      shell: powershell
      run: |
        #Expand-Archive -Path WindowsSDK_7.0A.zip -DestinationPath 'C:\Program Files (x86)\Microsoft SDKs\Windows\'
        Start-Process msiexec.exe -Wait -ArgumentList '/I WinSDKBuild\WinSDKBuild_x86.msi /quiet'
        Expand-Archive -Path WindowsSDK_7.1A.zip -DestinationPath 'C:\Program Files (x86)\Microsoft SDKs\Windows\'
        Expand-Archive -Path NETFX_4.0_Tools.zip -DestinationPath 'C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1A\Bin\'
        Copy-Item -Path 'C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1A\Bin' -Destination 'C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1\Bin' -Recurse
        #Remove-Item -Path 'C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1A' -Recurse -Force
        Rename-Item -Path 'C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1A' -NewName 'v7.0A'
        reg import 'WinSDK70.reg'

