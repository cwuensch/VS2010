        rem @set FrameworkDir64=C:\Windows\Microsoft.NET\Framework64\
        rem @set FrameworkVersion32=v4.0.30319
        rem @set FrameworkVersion64=v4.0.30319
        rem @set Framework35Version=v3.5
        rem @set VCTargetsPath=C:\Program Files (x86)\MSBuild\Microsoft.Cpp\v4.0\
        rem @echo Setting environment for using Microsoft Visual Studio 2010 x86 tools.
        rem @set INCLUDE=%VCINSTALLDIR%INCLUDE;%VCINSTALLDIR%ATLMFC\INCLUDE;%WindowsSdkDir%include
        rem @set LIB=%VCINSTALLDIR%LIB;%VCINSTALLDIR%ATLMFC\LIB;%WindowsSdkDir%lib
        rem @set LIBPATH=%FrameworkDir32%%FrameworkVersion32%;%FrameworkDir32%%Framework35Version%;%VCINSTALLDIR%LIB;%VCINSTALLDIR%ATLMFC\LIB
        rem @set PATH=%DevEnvDir%;%VCINSTALLDIR%BIN;%VSINSTALLDIR%Common7\Tools;%FrameworkDir32%%FrameworkVersion32%;%FrameworkDir32%%Framework35Version%;%PATH%
        rem call "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\vcvarsall.bat" x86
        set
        MSBuild /m /p:Configuration=Release /p:Platform=Win32 RS\RecStrip_VS\RecStrip.sln
        copy RS\RecStrip_VS\Release\RecStrip.exe RS\RecStrip_Win32.exe

