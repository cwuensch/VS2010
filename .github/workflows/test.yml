        rem @set VCTargetsPath=C:\Program Files (x86)\MSBuild\Microsoft.Cpp\v4.0\
        rem @echo Setting environment for using Microsoft Visual Studio 2010 x86 tools.
        rem @set INCLUDE=%VCINSTALLDIR%INCLUDE;%VCINSTALLDIR%ATLMFC\INCLUDE;%WindowsSdkDir%include
        rem @set LIB=C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\lib\amd64;C:\Program Files (x86)\Microsoft SDKs\Windows\v7.0A\Lib\x64
        rem @set LIBPATH=%FrameworkDir32%%FrameworkVersion32%;%FrameworkDir32%%Framework35Version%;%VCINSTALLDIR%LIB;%VCINSTALLDIR%ATLMFC\LIB
